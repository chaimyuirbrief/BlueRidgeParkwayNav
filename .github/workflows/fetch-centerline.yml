name: Fetch Parkway centerline

# Fetches the real Blue Ridge Parkway road geometry from OpenStreetMap and
# commits it into app/src/main/assets/brp_data.json so the app draws and
# routes the Parkway from exact geometry, fully offline.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and embed OSM centerline
        run: python3 scripts/fetch_centerline.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/brp_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Embed high-resolution OSM Blue Ridge Parkway centerline" \
              -m "Real road geometry from OpenStreetMap (© OpenStreetMap contributors, ODbL), fetched via Overpass and stitched/simplified by scripts/fetch_centerline.py."
            git push
          fi
