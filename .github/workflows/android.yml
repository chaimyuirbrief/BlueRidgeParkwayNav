name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble debug APK
        env:
          # SDK key (Maps SDK for Android + Places) — may be Android-app restricted.
          MAPS_API_KEY: ${{ secrets.maps_api_key }}
          # Directions web-service key — must NOT be Android-restricted. Optional: falls back to MAPS_API_KEY.
          DIRECTIONS_API_KEY: ${{ secrets.directions_api_key }}
          # Free NPS Data API key for live Blue Ridge Parkway road closures. Optional.
          NPS_API_KEY: ${{ secrets.nps_api_key }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parkway-nav-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
